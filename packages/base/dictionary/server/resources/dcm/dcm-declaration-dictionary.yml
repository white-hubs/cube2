schemaVersion: 1.0  # 代表文件格式定义版本, 缺省1.0
dataVersion: 1.0   # 代表文件数据版本, 单调增长, 仅供记录跟踪用.
common:
  appCode: DICT   # 提供方标识
  appDescription: 提供通用字典服务
provides:  # 提供的能力种类,  每个元素是一个对象, 也可以考虑用特定格式的字符串.第一版就先考虑下面示例的形态
  - {type: DictType, versions: [1.0]}
  - {type: DictEntry, versions: [1.0]}
requests:  # 需要的能力
  - provider: DICT  # 需要的能力的提供方, 同一个提供方的声明规格合并成一个请求.
    # 配置提供方不存在时是否报错, True 报错, False, 记录配置问题,后续处理. 第一期缺省TRUE 且仅支持TRUE
    isFailureOnMissingProvider: True
    requirements: # 基于每一个requirement项目, 生成一次对于provider提供的声明式定义原语的调用.
      - configType: DictType  # 需要的配置能力类型
        version: 1.0 # 配置能力描述使用的版本号
        vargs: ["TypeA", "TypeB", "TypeC"]
      - configType: DictEntry  # 系统字典配置

      - configType: DictEntry  # 数据字典
        isMandatory: True
        tenants: all
        kwargs:
          dictType: TypeB
        vargs: ["item3", "item4", "item5"]
      - configType: DictEntry  # 级联字典
        isMandatory: True
        tenants: all
        kwargs:
          dictType: TypeC
          isCascade: True
        vargs: ["item1", "item2", "item3"]
      - configType: DictEntry  # removal
        isRemoval: true
        kwargs:
          dictType: TypeA
        vargs: ["item4"]
