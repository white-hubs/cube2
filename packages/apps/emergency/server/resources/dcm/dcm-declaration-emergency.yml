          - applicationCode: COOLINGWATER
            applicationName: 冷冻水
          - applicationCode: COLDANDHEATSOURCES
            applicationName: 冷热源
          - applicationCode: PERIMETER_PREVENTION
            applicationName: 周界防范
          - applicationCode: BOLIER
            applicationName: 锅炉系统
          - applicationCode: WATERPURIFICATION
            applicationName: 净水系统
          - applicationCode: LOGISTICS
            applicationName: 物流管理
          - applicationCode: FRESH_AIR_MANAGEMENT
            applicationName: 新风管理
          - applicationCode: SECURITY_CHECKP
            applicationName: 安检通道
          - applicationCode: PASSENGER_FLOW_ANAL
            applicationName: 客流分析
          - applicationCode: CLEANCONDITIONING
            applicationName: 洁净空调
          - applicationCode: SEWAGE_TREATMENT
            applicationName: 污水处理
          - applicationCode: MEDICAL-REFRIGERATIO
            applicationName: 医用冷藏
          - applicationCode: SECURITY_MONITORING
            applicationName: 安防监控
          - applicationCode: GARDENS
            applicationName: 园林系统
          - applicationCode: EMERGENCY_RESOURCES
            applicationName: 应急资源
          - applicationCode: EMERGENCY_CALL
            applicationName: 紧急电话
          - applicationCode: ENVIRONMENT_MONITORI
            applicationName: 环境监控
          - applicationCode: TRAFFIC_LIGHT_SYS
            applicationName: 交通灯系统
          - applicationCode: TRAFFIC_CONTROL
            applicationName: 交通控制
          - applicationCode: TRAFFIC_FLOW_MONIRIN
            applicationName: 车流量监测
          - applicationCode: OPERATING_ROOM
            applicationName: 洁净手术室
          - applicationCode: ENERGY_CONSUMPTION
            applicationName: 能碳管理
      - configType: Rule  # 需要的配置能力类型
        version: 1.0 # 配置能力描述使用的版本号
        isMandatory: True
        isSystem: false
        tenants: all
        isFailOnMissingProvider: True
        kwargs:
          appCode: SECURITY_MONITORING #应用编号
        vargs:
          - name: 明火报警事件
            alarmLevelCode: one_level
            emergencyEventTypeCode: firecontrolEvent_mhbj
            enabled: True
            repeatTime: 5
            repeatTimeUnit: MINUTE
            estimatedHandlerTime: 30
            estimatedHandlerUnit: MINUTE
            remark: ""
            emergencyRuleCondGroups:
              - emergencyRuleCondList:
                  - deviceProdName: "海康摄像机" #产品名称
                    brandName: "海康"      #品牌名称
                    modelName: "监控摄像机"      #型号名称
                    conditionType: DEVICE_EVENT_CONDITION  #条件类型 CUSTOM_RULE_CONDITION:属性联动条件,DEVICE_EVENT_CONDITION:设备事件
                    deviceEventCode: flame #当conditionType=DEVICE_EVENT_CONDITION,需要填写事件编号
                    logicalOp:  #逻辑运算符,OR或AND,当conditionType=CUSTOM_RULE_CONDITION设值该值才会生效,目前只实现了OR(缺省值为OR)
                    emergencyRuleConditionExps:
                      - propCode: "@dev_event_delay@"  #属性code(在事件设值中这里填事件参数名称)
                        op:         #表达式(EQ,NE,IN,GT,GE,LE,LT,BETWEEN,NOT_IN),仅在属性规则中可用
                        oprand: "5"    #属性值(在事件设值中这里填事件参数值,目前只支持秒如果需要分钟需*60后填入)
                        delayTime:  #属性规则时设置该参数才会生效
                      - propCode: "@dev_event_interval@"
                        op:
                        oprand: "30"
                        delayTime:
                emergencyRuleTime:  #规则时段配置
                  timeType: "ALL"  #ALL:全天,WEEK:周,MONTH:月,TIME:时段
                  timeConditions:  #时段的json配置,若timeType=ALL,则不用填写。周配置样例"[3,4,5,6]",月配置样例"[1,2,3,4,5,6,7]",时段配置样例:"[{"beginTime":"16:00","endTime":"16:05"}]"

