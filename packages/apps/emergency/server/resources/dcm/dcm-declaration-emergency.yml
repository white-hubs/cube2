schemaVersion: 1.0  # 代表文件格式定义版本, 缺省1.0
dataVersion: 1.0   # 代表文件数据版本, 单调增长, 仅供记录跟踪用.
common:
  appCode: EMERGENCY   # 提供方标识
  appDescription: 提供通用预案规则服务
provides:  # 提供的能力种类,  每个元素是一个对象, 也可以考虑用特定格式的字符串.第一版就先考虑下面示例的形态
  - {type: EventType, versions: [1.0]}
  - {type: RuleType, versions: [1.0]}
  - {type: Rule, versions: [1.0]}
requests:  # 需要的能力
  - provider: EMERGENCY  # 需要的能力的提供方, 同一个提供方的声明规格合并成一个请求.
    # 配置提供方不存在时是否报错, True 报错, False, 记录配置问题,后续处理. 第一期缺省TRUE 且仅支持TRUE
    isFailureOnMissingProvider: True
    requirements: # 基于每一个requirement项目, 生成一次对于provider提供的声明式定义原语的调用.
      - configType: EventType  # 需要的配置能力类型
        version: 1.0 # 配置能力描述使用的版本号
        isMandatory: True
        isSystem: False
        tenants: all
        isFailOnMissingProvider: True
        vargs:
          - "code": "firecontrolEvent_mhbj"
            "name": "消防事件-明火报警"
            "initialized": True
            "remark": ""
          - "code": "firecontrolEvent_ywbj"
            "name": "消防事件-烟雾报警"
            "initialized": True
            "remark": ""
          - "code": "firecontrolEvent_wgzyxftd"
            "name": "消防事件-违规占用消防通道"
            "initialized": True
            "remark": ""
          - "code": "firecontrolEvent_sybj"
            "name": "消防事件-水压报警"
            "initialized": True
            "remark": ""
          - "code": "firecontrolEvent_sbbj"
            "name": "消防事件-手报报警"
            "initialized": True
            "remark": ""
          - "code": "firecontrolEvent_wgbj"
            "name": "消防事件-温感报警"
            "initialized": True
            "remark": ""
          - "code": "manageEvent_clwt"
            "name": "管理事件-车辆违停"
            "initialized": True
            "remark": ""
          - "code": "manageEvent_zdjy"
            "name": "管理事件-占道经营"
            "initialized": True
            "remark": ""
          - "code": "manageEvent_jtyd"
            "name": "管理事件-交通拥堵"
            "initialized": True
            "remark": ""
          - "code": "manageEvent_cybj"
            "name": "管理事件-违规抽烟"
            "initialized": True
            "remark": ""
          - "code": "electricEvent_dlbj"
            "name": "电气事件-电流报警"
            "initialized": True
            "remark": ""
          - "code": "electricEvent_dybj"
            "name": "电气事件-电压报警"
            "initialized": True
            "remark": ""
          - "code": "electricEvent_wdbj"
            "name": "电气事件-温度报警"
            "initialized": True
            "remark": ""
          - "code": "rotatingEvent_wsdbj"
            "name": "机房动环-温湿度报警"
            "initialized": True
            "remark": ""
          - "code": "rotatingEvent_upsbj"
            "name": "机房动环-UPS报警"
            "initialized": True
            "remark": ""
          - "code": "gas_rqxl"
            "name": "用气安全-燃气泄漏"
            "initialized": True
            "remark": ""
          - "code": "manageEvent_ddcgl"
