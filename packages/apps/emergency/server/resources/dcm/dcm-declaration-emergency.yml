            "initialized": True
            "remark": ""
          - "code": "manageEvent_xsgcgl"
            "name": "管理事件-小散工程管理"
            "initialized": True
            "remark": ""
      - configType: RuleType  # 需要的配置能力类型
        version: 1.0 # 配置能力描述使用的版本号
        isMandatory: True
        isSystem: True
        isFailOnMissingProvider: True
        vargs:
          - applicationCode: SECURITY_MONITORING
            applicationName: 安防监控
          - applicationCode: ELECTRICMANAGE
            applicationName: 电气管理
          - applicationCode: ROTATINGMANAGE
            applicationName: 动环报警
          - applicationCode: AIRCONDITIONER
            applicationName: 空调管理
          - applicationCode: FIRECONTROL
            applicationName: 消防管理
          - applicationCode: WATERSUPPLYDRAINAGE
            applicationName: 给排水
          - applicationCode: AIRSUPPLYANDEXHAUST
            applicationName: 送排风
          - applicationCode: INFORMATION_PUBLISH
            applicationName: 信息发布
          - applicationCode: MEDICAL_INTERCOM
            applicationName: 医护对讲
          - applicationCode: LIFT_MANAGEMENT
            applicationName: 电梯管理
          - applicationCode: INTRUDER_ALARM
            applicationName: 入侵报警
          - applicationCode: MEDICAL_GAS
            applicationName: 医用气体
          - applicationCode: TRIAGE_RANK
            applicationName: 分诊排号
          - applicationCode: SURGICAL_INSTRUCTION
            applicationName: 手术示教
          - applicationCode: ICU_MONITORING
            applicationName: ICU监测
          - applicationCode: MEDICAL_CRYOEXTRACTO
            applicationName: 医用冷冻冷藏
          - applicationCode: MEAT_TRADE
