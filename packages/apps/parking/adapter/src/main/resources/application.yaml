server:
  port: ${common-env.park-adapter.port:10222}
spring:
  config:
    import:
      - nacos:${NACOS_CLOUD_CONFIG:common-env.yaml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
      - nacos:${NACOS_CLOUD_CONFIG_JACKSON:common-jackson.yaml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
      - nacos:${NACOS_CLOUD_CONFIG_REDIS:common-redis.yaml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
      - nacos:${NACOS_CLOUD_CONFIG_SECURITY_CLIENT:common-security-client.yaml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
      - nacos:${NACOS_CLOUD_CONFIG_SECURITY_RESOURCE_SERVER:common-security-resource-server.yaml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
      - nacos:${NACOS_CLOUD_CONFIG_ROCKETMQ:common-rocketmq.yaml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
      - nacos:${NACOS_CLOUD_CONFIG_PLATFORM_FEGIN:common-platform-fegin.yaml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
      - nacos:${NACOS_CLOUD_CONFIG_PLATFORM_SECURITY:common-platform-security.yaml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
      - nacos:${NACOS_CLOUD_CONFIG_PLATFORM_HTTPCLIENT:common-platform-httpclient.yaml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        enabled: true
        namespace: ${spring.cloud.nacos.config.namespace}
      config:
        server-addr: ${NACOS_ADDR:192.168.0.133:38848}
        namespace: ${NACOS_NAMESPACE:25361486-9737-46a8-b488-4768cfd1fe77}
      server-addr: ${spring.cloud.nacos.config.server-addr}
    loadbalancer:
      enabled: true
logging:
  level:
    root: info
