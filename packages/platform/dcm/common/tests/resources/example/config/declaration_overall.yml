schemaVersion: 1.0  # 代表文件格式定义版本, 缺省1.0
dataVersion: 1.0   # 代表文件数据版本, 单调增长, 仅供记录跟踪用.
common:
  appCode: DICT   # 提供方标识
  appDescription: 提供通用字典服务
provides:  # 提供的能力种类,  每个元素是一个对象, 也可以考虑用特定格式的字符串.第一版就先考虑下面示例的形态
  - { type: TypeArrayNumber, versions: [1.0]}
  - { type: TypeNumber, versions: 1.0 }
  - { type: TypeString, versions: "1.0" }
  - { type: TypeCommaSeparatedNumber, versions: [1.0,1.1] }
  - { type: TypeCommaSeparatedString1, versions: ["1.0","1.1"] }
  - { type: TypeCommaSeparatedString2, versions: "v1.0,1.1" }
  - { type: DictType, versions: "1.0"}
  - { type: DictEntry, versions: "1.0,1.1" }

requests:  # 需要的能力
  - provider: DICT  # 需要的能力的提供方, 同一个提供方的声明规格合并成一个请求.
    # 配置提供方不存在时是否报错, True 报错, False, 记录配置问题,后续处理. 第一期缺省TRUE 且仅支持TRUE
    isFailureOnMissingProvider: True
    requirements: # 基于每一个requirement项目, 生成一次对于provider提供的声明式定义原语的调用.
      - configType: DictType  # 需要的配置能力类型
        version: 1.0 # 配置能力描述使用的版本号
        # 是否本配置项必选(必须配置成功, 失败则终止配置报错) 缺省为True
        isMandatory: True
        # tenants: all # 适用的租户, 可以是all, 或 [tenantId], 或','分割的tenantId. 为空(无key, null, 空白, 空集合) 都代表着是系统模式.
        # 匿名参数是数组, 数组元素的类型依赖于特定的模块支持的能力, 允许是数组,对象.
        vargs: ["TypeA", "TypeB"]
      - configType: DictEntry  # 应用于所有租户, 添加配置型参数样例
        isMandatory: True
        tenants: all
        kwargs:  # 命名参数, 可以为空
          dictType: TypeA  # dictType 是能力提供方提供的配置命令的参数
        vargs: ["item1", "item2", "item3"] # 匿名参数, 实际是否可以考虑把匿名参数作为命名参数的特例?
      - configType: DictEntry  # 应用于所有租户, 添加配置型参数样例
        isMandatory: True
        tenants: "1,2"
        kwargs:  # 命名参数, 可以为空
          dictType: TypeA  # dictType 是能力提供方提供的配置命令的参数
        vargs: ["item3", "item4", "item5"] # 匿名参数, 实际是否可以考虑把匿名参数作为命名参数的特例?
      - configType: DictEntry  # 删除型配置样例
        isMandatory: True
        tenants: [1,2]
        isRemoval: True
        kwargs:
          dictType: TypeB  # dictType 是能力提供方提供的配置命令的参数
        vargs: ["item1", "item2", "item3"]
