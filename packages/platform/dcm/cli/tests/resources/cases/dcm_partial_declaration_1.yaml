schemaVersion: 1.0
requests:
  - provider: DICT
    isPartialMode: true
    requirements:
      - configType: DictType
        version: '1.0'
        isMandatory: true
        vargs:
          - code: TypeA
            remark: Type A
          - code: TypeB
            remark: Type B
      - configType: DictEntry
        isMandatory: true
        kwargs:
          dictType: TypeA
        vargs:
          - item1
          - item2
          - item3
      - configType: DictEntry
        isMandatory: false
        tenants: all
        kwargs:
          dictType: TypeB
        vargs:
          - item1
          - item2
          - item3
