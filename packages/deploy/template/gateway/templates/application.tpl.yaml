# Generated by gateway deploy rule
server:
  port: ${common-env.gateway.port:3200}
spring:
  config:
    import:
      - nacos:${NACOS_CLOUD_CONFIG:common-env.yaml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
      - nacos:${NACOS_CLOUD_CONFIG_REDIS:common-redis.yaml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
      - nacos:${NACOS_CLOUD_CONFIG_SECURITY_RESOURCE_SERVER:common-security-resource-server.yaml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
      - nacos:${NACOS_CLOUD_CONFIG_GATEWAY:gateway.yaml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true

  cloud:
    nacos:
      discovery:
        enabled: true
        namespace: ${spring.cloud.nacos.config.namespace}
      config:
        server-addr: ${NACOS_ADDR:192.168.0.133:38848}
        namespace: ${NACOS_NAMESPACE:25361486-9737-46a8-b488-4768cfd1fe77}
      server-addr: ${spring.cloud.nacos.config.server-addr}
    loadbalancer:
      retry:
        enabled: true
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lowerCaseServiceId: true
              filters:
                - StripPrefix=1
          httpclient:
            pool:
              max-idle-time: 10000
          routes:
          # @formatter:off
{DEPS_SERVER_ROUTES}
          # @formatter:on
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_UNIQUE
logging:
  file:
    path: ./logs/gateway
  level:
    root: info


