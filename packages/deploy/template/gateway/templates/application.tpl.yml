# Generated by gateway deploy rule
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://fake:3200/ouaa/oauth/jwt.key
      resourceclient:
        clientcredential:
          client-id: inner_server
          client-secret: cli@pwd#ghy!123
          access-token-uri: http://fake:3200/ouaa/oauth/token
  cloud:
